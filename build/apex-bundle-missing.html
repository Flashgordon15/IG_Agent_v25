<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG Agent Apex — Unavailable</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0e14;
      color: #c8d6e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      max-width: 480px;
      text-align: center;
    }
    .icon {
      font-size: 40px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.7;
      margin-bottom: 8px;
    }
    code {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">&#9888;</div>
    <h1>Dashboard unavailable</h1>
    <p>Neither the live agent on <code>:8080</code> nor the shadow API on <code>:9090</code> responded.</p>
    <p>The local dashboard bundle (<code>dashboard/dist</code>) was also not found.</p>
    <p>Start the trading agent or rebuild the dashboard, then relaunch Apex.</p>
  </div>
</body>
</html>
